# Сбор → дедуп → LLM-анализ → экспорт для сайта → Telegram → коммит данных.
# Пуш данных автоматически запускает деплой сайта на Vercel (репо подключён к Vercel).
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SITE_BASE_URL
#   (опционально: HEALTHCHECK_URL)

name: monitor

on:
  schedule:
    # 07:17, 10:17, 13:17, 16:17, 19:17, 22:17 по Ташкенту (UTC+5). Cron в Actions — в UTC.
    # Факт 08–14.09: cron «0 3,7,11,15» давал только 3 прогона в день (03:00 не запускался
    # ни разу), а остальные опаздывали на 1–4 часа — GitHub задерживает и отбрасывает
    # расписания на «круглой» минуте :00. Минута 17 и 6 слотов — чтобы лоты попадали в
    # канал в день публикации (прогон ≈ 5 мин, ~900 мин/мес из 2000 бесплатных).
    - cron: "17 2,5,8,11,14,17 * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # верхушка ветки НА МОМЕНТ СТАРТА, а не SHA на момент dispatch:
          fetch-depth: 10    # два запуска подряд иначе стартуют с одной старой БД (25.09)

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HEADLESS_ENABLED: "1"
          HEADLESS_ON: "xtxarid,ebrd,ungm"
          INSIGHT_EVERY_DAYS: "1"   # аналитический дайджест — каждый день
        run: python pipeline/run.py --run

      - name: Commit data
        run: |
          git config user.name "ta-tenders-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/monitor.db web/data
          if git diff --cached --quiet; then
            echo "Нет изменений данных"; exit 0
          fi
          git commit -m "data: обновление $(date -u +'%Y-%m-%d %H:%M UTC')"
          # main мог уйти вперёд (пуш кода во время прогона): переносим наш коммит данных
          # поверх. При конфликте по данным (бинарная БД, JSON) побеждает наша версия —
          # она свежее (в rebase «theirs» = переносимый коммит). Иначе прогон падал,
          # а отправленные в Telegram карточки оставались без пометки → дубли (25.09).
          for i in 1 2 3; do
            git push && exit 0
            git fetch --depth=10 origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
